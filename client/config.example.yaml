# Proxmox Backup Client Manager - Client Configuration

# Unique identifier for this client (Machine ID)
clientId:

# Log level for the client (debug, info, warn, error)
logLevel: "info"

# URL of the PBCM Server (e.g., http://your-server:3000)
serverUrl:

# Authentication token for server communication
# Provided during initial registration and stored locally — do not set manually.
authToken:

# Secret for server-initiated (inbound) registration.
# Set this when the server connects to the client instead of the other way around.
# Must match the value entered in the server's "Add Outbound Client" dialog.
# Automatically removed from config after successful registration.
registrationSecret:

# Random delay (0..N seconds) before requesting the SSH reverse tunnel from the
# server. Spreads simultaneous cron starts across a window so that many jobs
# firing at the same minute do not hit the tunnel limit all at once.
# Only relevant for outbound clients. Set to 0 to disable the delay.
tunnelAcquireJitterSeconds: 30

# TCP port for the local web UI and, in outbound mode, for the /ws/register and
# /ws/agent endpoints the server dials. Change this if 3001 is already taken on the
# host — the port must then also appear in the client's target address on the server
# ("Zieladresse", editable in the client editor).
# The environment variable PBCM_CLIENT_PORT overrides this value.
listenPort: 3001

# Accept a PBCM server certificate that does not validate (e.g. self-signed), for
# registration and for the WebSocket connection alike. Leave false when the server has a
# certificate from a trusted CA: the connection carries this agent's auth token, and an
# unchecked certificate is one anybody in between can present. The reachability check on
# the web UI tolerates it anyway. The PBS certificate is not affected -- that one is pinned
# by its fingerprint.
allowSelfSignedCertificates: false

# Networks the server is allowed to dial this agent from, in CIDR notation.
# Only relevant for outbound clients: in that mode the agent listens on every
# interface of the host, and the two endpoints above are open to anyone who can
# reach listenPort. It matters most for /ws/register, where the caller supplies the
# auth token the agent then stores permanently.
# Empty (the default) allows every address, which is how the agent behaved before
# this setting existed.
# The address checked is the peer of the TCP connection, so an agent behind a
# reverse proxy must list the proxy's network, not the server's.
# The local web UI on the same port is deliberately NOT restricted by this — it is
# where the registration secret is entered, and locking it down here would shut the
# operator out of the setup surface.
# A wrong value can only be corrected on this host: the connection you would fix it
# over is the one being refused.
allowedNetworks: []

# Executable name/path for proxmox-backup-client
executable: "proxmox-backup-client"

# Optional: Static parameters to always append to backup jobs
# For example, to include all file systems:
backupParams:
    - "--all-file-systems"
    - "true"

# Optional: Static parameters to always append to restore jobs
restoreParams: []

# Delay in seconds to wait before restarting a queued job
queueDelaySeconds: 5

# Retention time in days for job history and schedule state
retentionTime: 90

# Optional: Scripts to run before and after a job execution.
# Arguments passed: $1 = operation (backup/restore), $2 = job name
# If the script exits with a non-zero code, the operation will be aborted.
# preScript: "/path/to/pre-script.sh"
# postScript: "/path/to/post-script.sh"
