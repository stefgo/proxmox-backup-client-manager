services:
  pbcm-server:
    container_name: pbcm-server
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      # The root `npm ci` resolves @stefgo/react-ui-components from GitHub
      # Packages, which refuses anonymous reads. Same secret compose.dev.yaml
      # and the CI build pass.
      secrets:
        - npm_token
    # Published by build.yml. `docker compose pull` fetches this tag; a local
    # `docker compose build` overwrites it on this host with a self-built image.
    image: ghcr.io/stefgo/pbcm-server:latest
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database and other data
      - server-data:/app/server/backend/data
      # Persist configuration (ensure this file exists or is created)
      # The server runs as UID 1000; the entrypoint hands both paths to that user if it
      # cannot write them, so the file may belong to UID 1000 on the host afterwards.
      - ./server-config.yaml:/app/server/config.yaml
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Behind a reverse proxy: its address, so X-Forwarded-For/-Proto are believed. Without
      # it every request appears to come from the proxy. Comma separated; IPs, CIDRs or
      # loopback / linklocal / uniquelocal. Overrides security.trusted_proxies.
      # - PBCM_TRUSTED_PROXIES=172.16.0.0/12
    # The image already carries this HEALTHCHECK, so this block is a repetition on
    # purpose: it keeps the behaviour visible in the file operators actually read and
    # edit. Node is in the image and Node 22 has fetch as a global, so no curl.
    #
    # It asks the address the server writes to /tmp/pbcm-health.json once it listens, so it
    # follows a port set in config.yaml as well as PBCM_SERVER_PORT. That takes an image
    # which writes the file: an older tag reports unhealthy under this block.
    #
    # Note that Docker does NOT restart an unhealthy container -- `restart:` above
    # reacts to the process exiting, not to health. This makes the state readable in
    # `docker ps` and usable for `depends_on: condition: service_healthy`.
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.resolve().then(() => fetch(JSON.parse(require('fs').readFileSync('/tmp/pbcm-health.json', 'utf8')).url)).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  pbcm-client:
    container_name: pbcm-client
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      # The root `npm ci` resolves @stefgo/react-ui-components from GitHub
      # Packages, which refuses anonymous reads. Same secret compose.dev.yaml
      # and the CI build pass.
      secrets:
        - npm_token
    # amd64 and arm64 ship as two image names, not one manifest -- on an ARM
    # host use ghcr.io/stefgo/pbcm-client-arm64:latest instead.
    image: ghcr.io/stefgo/pbcm-client:latest
    ports:
      - "3001:3001"
    # Outbound clients: the SSH reverse tunnel terminates in the network namespace of
    # the sshd, i.e. on the host. A bridged container has its own loopback and cannot
    # reach the forward, so host networking is required. The ports: block above is then
    # ignored — pick a free port via PBCM_CLIENT_PORT if 3001 is taken on the host.
    # network_mode: host
    #
    # The agent runs as root, because a backup reads files whatever their owner and a
    # restore puts owners and modes back. What root may do beyond that is taken away:
    # - cap_drop: ALL, then only what proxmox-backup-client needs. A backup needs
    #   DAC_READ_SEARCH alone -- without it files of other users are left out of the
    #   snapshot, and the run still ends well. The other six are for restores:
    #   DAC_OVERRIDE writes into directories of other users, CHOWN and FOWNER put owners
    #   and modes back, FSETID keeps a setgid bit, MKNOD creates device nodes and SETFCAP
    #   file capabilities. An agent that only ever backs up can do without those six.
    #   Gone are, among others, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID, SYS_CHROOT and
    #   KILL. A job's hook scripts run under the same limits.
    # - no-new-privileges stops setuid binaries from raising privileges again.
    # - read_only: the agent writes config.yaml, its data volume and the paths mounted for
    #   a restore, nothing else. /tmp holds a run's keyfile and stays in memory.
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - FSETID
      - MKNOD
      - SETFCAP
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Persist client configuration
      - ./client-config.yaml:/app/client/config.yaml
      # The agent's data files: the identity it was issued at registration, its jobs (the
      # only copy), their schedule state and its run history. Losing this volume means
      # registering the agent again and recreating its jobs. A named volume, and it has to
      # stay one -- the line above is a single-file bind mount, so anything written beside
      # config.yaml lives in the container and is gone with the next recreate.
      - client-data:/app/client/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # The clock job schedules repeat on. Without it the agent uses UTC.
      # - TZ=Europe/Berlin
      # Outbound registration takes the setup PIN from `docker logs pbcm-client`. For an
      # unattended rollout give the agent a secret the Add Client wizard accepts instead
      # (with the `secrets:` entries here and below). Remove it once the agent is registered.
      # - PBCM_REGISTRATION_SECRET_FILE=/run/secrets/pbcm_registration
    # secrets:
    #   - pbcm_registration
    # See the server above for why this repeats what the image already declares.
    # Two agent-specific points: the probe asks the port and scheme the agent reports in
    # /tmp/pbcm-health.json once it listens, so a port or `tls` block set in config.yaml
    # or through PBCM_CLIENT_PORT is followed either way -- which matters under
    # `network_mode: host`. And /api/health answers loopback only -- the probe runs inside
    # the container, so it gets an answer where nobody else does. The route is served
    # whatever config.yaml disables.
    #
    # An image from before that file asks PBCM_CLIENT_PORT (default 3001), plain HTTP
    # first, then HTTPS -- see Dockerfile.client, also for why the certificate is not
    # verified.
    #
    # It reports on the agent, not on the connection to the server -- an agent that
    # cannot reach the server still runs its jobs from its own database and is healthy.
    healthcheck:
      test: ["CMD", "node", "-e", "const get = (u) => new Promise((done) => require(u.split(':')[0]).get(u, { rejectUnauthorized: false }, (r) => done(r.statusCode)).on('error', () => done(0))); let f; try { f = JSON.parse(require('fs').readFileSync('/tmp/pbcm-health.json', 'utf8')).url; } catch {} const u = '://127.0.0.1:' + (process.env.PBCM_CLIENT_PORT || 3001) + '/api/health'; (f ? get(f) : get('http' + u).then((s) => s || get('https' + u))).then((s) => process.exit(s === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  server-data:
  client-data:

secrets:
  npm_token:
    environment: NPM_TOKEN
  # pbcm_registration:
  #   file: ./pbcm-registration.secret
