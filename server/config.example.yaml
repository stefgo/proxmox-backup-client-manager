# Proxmox Backup Client Manager - Server Configuration

# Log level for the server (trace, debug, info, warn, error, fatal)
# Can be overridden by the LOG_LEVEL environment variable
logLevel: info

# Port the server listens on. Defaults to 3000 when left out.
# Can be overridden by the PBCM_SERVER_PORT environment variable; an unusable value ends
# the start. This is the published port: the container exposes it and compose.yaml maps it,
# so moving it here means moving it there too.
#port: 3000

# OpenID Connect (OIDC) authentication settings
oidc:
    enabled: false
    issuer:
    client_id:
    client_secret:
    redirect_uri:

# Secret key used to sign and verify JSON Web Tokens (JWT) for user sessions
# This should be a long, random string
jwtSecret:

# JWT token expiration time (e.g. "24h", "7d", "30m"). If not set, tokens never expire.
jwtExpiresIn: "24h"

# General server settings
# The values below are the same ones the server falls back to when a key is missing, so
# this block documents the defaults rather than changing them. What a "0" means depends on
# the key: an interval of 0 switches that cleanup's timer off (Run Now on the settings page
# still works), a token retention of 0 days removes every invalid token on the next run,
# and a job history retention of 0 days drops the age limit, leaving only the per-client
# count.
settings:
    # Number of days an invalid token remains in the database before being deleted
    token_retention_days: "30"
    # Hours between two automatic runs of the token cleanup
    token_cleanup_interval_hours: "24"
    # Number of days job history entries remain in the database before being deleted
    retention_job_history_days: "90"
    # Ensure at least this many job history entries are kept per client (at least 1)
    retention_job_history_count: "50"
    # Hours between two automatic runs of the job history cleanup
    job_history_cleanup_interval_hours: "24"

# Security network settings
security:
    # List of CIDR subnets an agent may open its WebSocket session from (/ws/agent).
    # If empty, every address is allowed.
    # This is the perimeter and applies to all agents alike. Which address a single
    # client is bound to is a property of that client (inbound_allowed_ip, set with
    # its registration token and editable in the client editor) — an empty list here
    # means no perimeter was configured, while a client without an allowed address is
    # refused outright.
    allowed_networks: []
    # Accept a certificate this server cannot verify when dialling an outbound agent over
    # wss:// (default: false). Applies to every outbound agent alike.
    # Only relevant for clients whose target address is written as wss://host:port; a plain
    # host:port is dialled over ws:// and has no certificate to check in the first place.
    # Enable it for agents carrying a self-signed certificate, which is the usual case on a
    # home network. With a certificate from a CA this host trusts, leave it off -- the
    # session it protects carries the agent's auth token.
    # This is about the agent's certificate only; the PBS certificate is pinned by its
    # fingerprint and unaffected.
    # allow_self_signed_agent_certificates: false

# Not listed here: the "tunnel:" section for the SSH reverse tunnel. The server writes it
# with its defaults on first start, so a copy of this file does not need it — and it must
# not carry tunnel.keySecret, which is generated per installation and encrypts the stored
# SSH keys: sharing that value would share one key across every installation that copied
# the file.
# The parameters and what each of them does are documented in docs/tunnel.md.
