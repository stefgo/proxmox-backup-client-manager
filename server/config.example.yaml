# Proxmox Backup Client Manager - Server Configuration

# Log level for the server (trace, debug, info, warn, error, fatal, silent)
# Can be overridden by the LOG_LEVEL environment variable
logLevel: info

# Port the server listens on. Defaults to 3000 when left out.
# Can be overridden by the PBCM_SERVER_PORT environment variable; an unusable value ends
# the start. This is the published port: the container exposes it and compose.yaml maps it,
# so moving it here means moving it there too.
#port: 3000

# OpenID Connect (OIDC) authentication settings. Local login keeps working alongside it.
# While enabled is true, the four values below are required; leave the block as it is
# to log in with local accounts only.
oidc:
    # Offer login through the OIDC provider on the login page (default: false).
    enabled: false
    # The provider's issuer URL; its /.well-known/openid-configuration is read on start.
    issuer:
    # Client id and secret of this application, as registered at the provider.
    client_id:
    client_secret:
    # The URL the provider sends the browser back to after login. Register exactly this
    # URL at the provider: https://<this server>/api/auth/callback
    redirect_uri:

# Secret key used to sign and verify JSON Web Tokens (JWT) for user sessions
# This should be a long, random string
jwtSecret:

# Encrypts the secrets the server stores: SSH keys of the tunnels, PBS token secrets of
# the repositories, auth tokens of outbound clients. Generated on first start when empty.
# Generated per installation -- do not copy a filled-in value between installations.
# Losing or changing it means entering every repository secret and tunnel key again and
# registering every outbound client again.
secretKey:

# JWT token expiration time (e.g. "24h", "7d", "30m"). Defaults to "12h" if not set.
# Tokens always expire; there is no setting that turns expiry off. The dashboard's
# session cookies carry the same lifetime.
jwtExpiresIn: "12h"

# General server settings
# The values below are the same ones the server falls back to when a key is missing, so
# this block documents the defaults rather than changing them. What a "0" means depends on
# the key: an interval of 0 switches that cleanup's timer off (Run Now on the settings page
# still works), a token retention of 0 days removes every invalid token on the next run,
# and a job history retention of 0 days drops the age limit, leaving only the per-client
# count.
settings:
    # Number of days an invalid token remains in the database before being deleted
    token_retention_days: "30"
    # Hours between two automatic runs of the token cleanup
    token_cleanup_interval_hours: "24"
    # Number of days job history entries remain in the database before being deleted
    retention_job_history_days: "90"
    # Ensure at least this many job history entries are kept per client (at least 1)
    retention_job_history_count: "50"
    # Hours between two automatic runs of the job history cleanup
    job_history_cleanup_interval_hours: "24"

# Security network settings
security:
    # List of CIDR subnets an agent may open its WebSocket session from (/ws/agent).
    # If empty, every address is allowed.
    # This is the perimeter and applies to all agents alike. Which address a single
    # client is bound to is a property of that client (inbound_allowed_ip, set with
    # its registration token and editable in the client editor) — an empty list here
    # means no perimeter was configured, while a client without an allowed address is
    # refused outright.
    allowed_networks: []
    # Reverse proxies whose X-Forwarded-For/-Proto headers this server believes: IP
    # addresses, CIDR networks, or loopback / linklocal / uniquelocal. Empty (default)
    # believes no one, so the client address is the connection's own.
    # Behind a proxy, list it here (or in PBCM_TRUSTED_PROXIES) -- otherwise every request
    # appears to come from the proxy, and the session cookie loses its Secure flag behind
    # a TLS-terminating one. Read at startup only.
    # Example for a proxy in a Docker network next to this container:
    # trusted_proxies: ["uniquelocal"]
    trusted_proxies: []
    # Send the Strict-Transport-Security header (default: false). Only enable this when the
    # dashboard is reached exclusively via HTTPS: browsers remember the header for months and
    # refuse plain http:// for this host from then on, even after it is switched off again.
    # hsts: false
    # Accept a certificate this server cannot verify when dialling an outbound agent over
    # wss:// (default: false). Applies to every outbound agent alike.
    # Only relevant for clients whose target address is written as wss://host:port; a plain
    # host:port is dialled over ws:// and has no certificate to check in the first place.
    # Enable it for agents carrying a self-signed certificate, which is the usual case on a
    # home network. With a certificate from a CA this host trusts, leave it off -- the
    # session it protects carries the agent's auth token.
    # This is about the agent's certificate only; the PBS certificate is pinned by its
    # fingerprint and unaffected.
    # allow_self_signed_agent_certificates: false

# SSH reverse tunnel (see docs/tunnel.md). The server writes this block with its defaults
# on first start, so it can stay commented out; the values below are those defaults.
# tunnel:
#     # Kill switch: false refuses every tunnel request, so jobs that require the tunnel
#     # fail instead of running (default: true).
#     enabled: true
#     # Address the forward is bound to on the client host when the connection test runs.
#     # A real tunnel binds to the address stored with the client, which is 127.0.0.1.
#     # Never 0.0.0.0: that would open the forward to the client's network and needs
#     # GatewayPorts in its sshd.
#     remoteBindHost: 127.0.0.1
#     # How long the SSH connection to the client may take to become ready, in ms.
#     connectTimeoutMs: 10000
#     # Interval of the SSH keepalive packets, in ms. Detects a dead connection early.
#     keepaliveIntervalMs: 15000
#     # How long an SSH connection stays open after its last lease was released, in ms, so
#     # that the next job of the same client does not have to connect again.
#     idleGraceMs: 60000
#     # Longest lifetime of one lease, in ms (default: 24 h). A lease still held after this
#     # is released: a safety net against a client that never released it.
#     maxLeaseMs: 86400000
#     # How long a request waits for a free slot while maxConcurrentTunnels are in use, in ms.
#     # After that it fails with "Too many concurrent tunnels".
#     acquireTimeoutMs: 20000
#     # Most SSH connections open at the same time, across all clients. One client counts
#     # once, however many of its jobs use the tunnel.
#     maxConcurrentTunnels: 20
#     # Shortest time between two tunnel requests of the same client, in ms. A request
#     # sooner than that is refused (rate limit).
#     minRequestIntervalMs: 3000
