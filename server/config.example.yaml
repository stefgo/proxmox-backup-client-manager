# Proxmox Backup Client Manager - Server Configuration

# Log level for the server (trace, debug, info, warn, error, fatal)
# Can be overridden by the LOG_LEVEL environment variable
logLevel: info

# OpenID Connect (OIDC) authentication settings
oidc:
    enabled: false
    issuer:
    client_id:
    client_secret:
    redirect_uri:

# Secret key used to sign and verify JSON Web Tokens (JWT) for user sessions
# This should be a long, random string
jwtSecret:

# JWT token expiration time (e.g. "24h", "7d", "30m"). If not set, tokens never expire.
jwtExpiresIn: "24h"

# General server settings
settings:
    # Number of days an invalid token remains in the database before being deleted
    retention_invalid_tokens_days: "0"
    # Ensure at least this many invalid tokens are always kept, overriding the days setting if needed
    retention_invalid_tokens_count: "0"
    # Number of days job history entries remain in the database before being deleted
    retention_job_history_days: "90"
    # Ensure at least this many job history entries are kept per client
    retention_job_history_count: "50"

# Security network settings
security:
    # List of CIDR subnets an agent may open its WebSocket session from (/ws/agent).
    # If empty, every address is allowed.
    # This is the perimeter and applies to all agents alike. Which address a single
    # client is bound to is a property of that client (inbound_allowed_ip, set with
    # its registration token and editable in the client editor) — an empty list here
    # means no perimeter was configured, while a client without an allowed address is
    # refused outright.
    allowed_networks: []

# Not listed here: the "tunnel:" section for the SSH reverse tunnel. The server writes it
# with its defaults on first start, so a copy of this file does not need it — and it must
# not carry tunnel.keySecret, which is generated per installation and encrypts the stored
# SSH keys: sharing that value would share one key across every installation that copied
# the file.
# The parameters and what each of them does are documented in doc/tunnel.md.
