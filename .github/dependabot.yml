version: 2

# Only the actions. A pinned action does not age loudly -- it keeps working until the
# runner drops the version, and then a workflow that nobody touched fails. One grouped
# pull request a month is the cheapest way to notice.
#
# Noticing was never the problem. This repository is maintained without pull requests,
# so the monthly one waited, and six actions drifted up to two major versions behind
# while the configuration looked like it was doing its job. dependabot-auto-merge.yml
# is the other half: the pull request merges itself once its checks are green.
#
# npm is deliberately absent. Four workspaces with a React, Fastify and build toolchain
# produce a stream of version bumps that nobody can assess without a test suite, and this
# project has none -- the pull requests would be merged unread or ignored, and both are
# worse than not opening them. Security-relevant npm updates still arrive on their own:
# Dependabot security updates need no configuration file.
updates:
    - package-ecosystem: github-actions
      directory: "/"
      # dev, not main. ci.yml runs on the pull request, but an action bump is mostly
      # about actions ci.yml never touches -- docker/build-push-action, the artifact
      # pair, metadata-action. The only thing that exercises those is build.yml, and
      # build.yml runs after a merge, not before one. Landing the bump on dev means it
      # is the developer image that breaks, and the smoke test there says so; main
      # stays the state released to everyone until dev is merged into it.
      target-branch: dev
      schedule:
          interval: monthly
      # One pull request for all of them rather than one per action.
      groups:
          actions:
              patterns: ["*"]
      commit-message:
          # Conventional Commits are enforced by .githooks/commit-msg, but Dependabot
          # does not run it -- the prefix has to be configured here. `ci` keeps the
          # bump out of the release notes, which is where an action update belongs.
          prefix: "ci"
      labels:
          - dependencies
