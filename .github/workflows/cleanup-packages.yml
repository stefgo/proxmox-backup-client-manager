name: Prune Registry

on:
    schedule:
        - cron: "0 2 * * *" # Runs every night at 02:00
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Log what would be deleted, delete nothing"
                type: boolean
                default: true

# The action is explicitly not safe to run twice against the same package. The
# nightly schedule and a manual run can otherwise meet. Not cancelling: aborting
# a run halfway through a delete is the worse of the two outcomes.
concurrency:
    group: cleanup-images
    cancel-in-progress: false

jobs:
    delete-old-packages:
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read

        steps:
            # dataaxiom/ghcr-cleanup-action instead of actions/delete-package-versions,
            # because the latter does not know what a manifest child is. A multi-arch
            # build pushes its per-architecture images and its attestations untagged;
            # only the manifest list carries the tag. Deleting "untagged versions" from
            # such a package therefore hollows out the tagged images -- that is how
            # pbcm-server:main lost all four of its children while the tag stayed.
            - name: Delete unwanted versions
              uses: dataaxiom/ghcr-cleanup-action@v1
              with:
                  # **A new image has to be added here by hand.** The action
                  # touches only the packages it is named, so one that is missing
                  # is neither pruned nor protected by exclude-tags below, and
                  # nothing turns red about it.
                  packages: pbcm-server,pbcm-client,pbcm-client-arm64

                  # A child of a kept tag does not count as untagged here. This is the
                  # whole difference to the previous action.
                  delete-untagged: true
                  keep-n-tagged: 10

                  # Safety net for the pointers nobody may lose. `main` used to be
                  # deliberately absent, because that tag was broken and
                  # delete-partial-images was meant to clear it. It is a production
                  # pointer again since build.yml publishes the rolling :main image,
                  # so it has to be protected like :dev and :latest. The two version
                  # patterns keep every release pullable -- a deleted 1.3.2 breaks
                  # whoever pinned it, so release images are meant to accumulate.
                  exclude-tags: latest,main,dev,*.*.*,*.*

                  # Removes manifests whose children are gone, i.e. the damage the
                  # previous configuration already did.
                  delete-ghost-images: true
                  delete-partial-images: true

                  # Verifies after the run that every multi-arch image still has all
                  # of its platform children. Kept on for the log, but it only
                  # *warns* -- the action never fails on it. The step below is what
                  # makes that finding arrive somewhere.
                  validate: true

                  # Manual runs default to a dry run; the nightly schedule passes no
                  # input and deletes.
                  dry-run: ${{ inputs.dry_run || false }}

            # `validate: true` above writes its finding into the log of a job that
            # runs at two in the morning and is read by nobody -- which is nearly
            # the state that let pbcm-server:main become a tag whose four children
            # all return 404. This step checks the same thing and *fails*, and a
            # failing scheduled run is what GitHub sends a mail about.
            #
            # It resolves every child digest individually rather than trusting the
            # index -- a hollowed-out image still lists its platforms in the
            # manifest list, and only fetching the child shows that it is gone.
            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify the protected tags survived
              run: |
                  owner=${{ github.repository_owner }}
                  rc=0

                  verify() {
                      local ref=$1 raw digests image bad=0 d
                      if ! raw=$(docker buildx imagetools inspect --raw "$ref" 2>/dev/null); then
                          # A tag that does not exist yet is not a defect: latest
                          # appears with the first release, dev only once dev was
                          # pushed. A tag that vanished shows up as a missing child
                          # of something else, or in the next release attempt.
                          echo "  $ref -- absent, nothing to verify"
                          return 0
                      fi
                      digests=$(jq -r '.manifests[]?.digest // empty' <<< "$raw")
                      if [ -z "$digests" ]; then
                          echo "  $ref -- ok (single manifest)"
                          return 0
                      fi
                      image=${ref%:*}
                      for d in $digests; do
                          if ! docker buildx imagetools inspect --raw "$image@$d" > /dev/null 2>&1; then
                              echo "::error::$ref points at $d, which no longer exists"
                              bad=1
                          fi
                      done
                      if [ "$bad" -eq 0 ]; then
                          echo "  $ref -- ok ($(echo $digests | wc -w) children)"
                      fi
                      return "$bad"
                  }

                  for image in pbcm-server pbcm-client pbcm-client-arm64; do
                      for tag in latest main dev; do
                          verify "ghcr.io/$owner/$image:$tag" || rc=1
                      done
                  done
                  exit $rc
