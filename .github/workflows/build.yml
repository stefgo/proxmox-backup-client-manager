name: Build and Version Client and Server

on:
    push:
        branches: ["main"]
        tags: ["v*.*.*"] # Reacts to tags like v1.0.2
    workflow_dispatch: # Allows manual trigger in the Actions tab

env:
    REGISTRY: ghcr.io
    SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/pbcm-server

jobs:
    # Typecheck and lint before anything is published. Reuses ci.yml rather than
    # restating the steps, so the release gate cannot drift from the branch checks.
    verify:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            packages: read

    # Single source of truth for the version string, consumed by all build jobs.
    prepare:
        needs: verify
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Determine Version
              id: version
              run: |
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    # Use tag name directly
                    echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
                  else
                    # Use branch-sha
                    SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
                    echo "version=${GITHUB_REF_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
                  fi

    # Client images are published as two separate, single-arch image names.
    # Each one builds on a native runner for its architecture - no QEMU.
    build-client:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - id: client
                      runner: ubuntu-latest
                      image_name: pbcm-client
                      dockerfile: ./docker/Dockerfile.client
                      platform: linux/amd64
                    - id: client-arm64
                      runner: ubuntu-24.04-arm
                      image_name: pbcm-client-arm64
                      dockerfile: ./docker/Dockerfile.client.arm64
                      platform: linux/arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
                  tags: |
                      # For a push to main: Uses the branch name (main) and the SHA
                      type=ref,event=branch
                      type=sha,prefix=sha-

                      # For a git tag (v1.0.0): Creates version tags AND the latest tag
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: ${{ matrix.platform }}
                  push: true
                  # Pass the calculated version as a build argument
                  build-args: |
                      APP_VERSION=${{ needs.prepare.outputs.version }}
                  # Pass GitHub token as secret for npm authentication
                  secrets: |
                      npm_token=${{ secrets.NPM_TOKEN }}
                  # Uses the automatically generated tags from above
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.id }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.id }}

    # The server ships as a real multi-arch manifest. Each architecture is built
    # natively and pushed by digest only; merge-server assembles the manifest.
    build-server:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                      platform: linux/amd64
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      platform: linux/arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Tags are applied by the merge job; here we only need the labels.
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.SERVER_IMAGE }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/Dockerfile.server
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      APP_VERSION=${{ needs.prepare.outputs.version }}
                  secrets: |
                      npm_token=${{ secrets.NPM_TOKEN }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=server-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
                  outputs: type=image,name=${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-server-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge-server:
        needs: [build-server]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-server-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.SERVER_IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.SERVER_IMAGE }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.version }}
