# Builds and publishes the container images. It creates no version number --
# that is release.yml alone, on request. See the trigger comments below.
name: Build Images

on:
    push:
        # Both long-lived branches publish a rolling image, so the current state
        # is always pullable without waiting for a release: :main is the state
        # released to everyone, :dev the one for developers. Neither creates a
        # version -- that happens only in release.yml, on request.
        #
        # The tag name needs no extra rule: type=ref,event=branch below already
        # yields the branch name, which is exactly `main` and `dev`.
        branches: ["main", "dev"]
        # A stable tag reaches this workflow only through the workflow_dispatch
        # that release.yml fires -- semantic-release pushes the tag over
        # GITHUB_TOKEN, and such a push creates no workflow run. The filter still
        # covers a tag pushed by hand, and would cover a prerelease (v1.4.0-beta.1)
        # the same way.
        tags: ["v*.*.*"]
        # A commit that only touches documentation changes nothing inside the
        # images, so it need not rebuild four of them. Path filters apply to
        # branch pushes only -- neither workflow_dispatch nor a tag is affected,
        # so the route a release takes to get here stays untouched.
        paths-ignore:
            - "docs/**"
            - "**.md"
    workflow_dispatch: # Allows manual trigger in the Actions tab, for any branch

# Pushing twice in a row to dev makes the older build pointless. Tag builds are
# never cancelled -- their image is the artefact of a release.
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The registry is named once, here, and nothing else in this file spells it out.
# The server image name cannot join it: an entry in an `env` block cannot
# reference another entry of the same block, and the `env` context is not
# available in a job's `env` either -- only in a step. `prepare` therefore
# composes the name in a `run:` step, where REGISTRY is an ordinary environment
# variable, and the three server jobs take it from `needs` into their own job
# `env`, which does accept that context.
env:
    REGISTRY: ghcr.io

jobs:
    # Typecheck and lint before anything is published. Reuses ci.yml rather than
    # restating the steps, so the release gate cannot drift from the branch checks.
    verify:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            packages: read

    # Single source of truth for the version string, consumed by all build jobs.
    prepare:
        needs: verify
        runs-on: ubuntu-latest
        # Computes a string from GITHUB_REF and GITHUB_SHA -- no checkout, no
        # registry, no API. Stated rather than left to the repository default.
        permissions: {}
        outputs:
            version: ${{ steps.version.outputs.version }}
            # Composed here so that REGISTRY above is the only place the registry
            # host appears. Job-level `env` cannot reach `env.REGISTRY`, but it
            # can reach `needs`, which is what the server jobs below use.
            server_image: ${{ steps.version.outputs.server_image }}
            client_image: ${{ steps.version.outputs.client_image }}
            client_image_arm64: ${{ steps.version.outputs.client_image_arm64 }}
        steps:
            - name: Determine Version
              id: version
              run: |
                  echo "server_image=$REGISTRY/${{ github.repository_owner }}/pbcm-server" >> $GITHUB_OUTPUT
                  echo "client_image=$REGISTRY/${{ github.repository_owner }}/pbcm-client" >> $GITHUB_OUTPUT
                  echo "client_image_arm64=$REGISTRY/${{ github.repository_owner }}/pbcm-client-arm64" >> $GITHUB_OUTPUT
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    # Tag name without the leading v, so the string baked into the
                    # image matches the Docker tag (1.5.0), the root package.json
                    # and a locally built image. The tag itself stays v1.5.0.
                    echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
                  else
                    # Every other ref -- a branch push or a manual dispatch --
                    # becomes <branch>-<short sha>. It is not a version and is
                    # not meant to look like one; the branch name is what makes
                    # that visible in `docker inspect`.
                    SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
                    echo "version=${GITHUB_REF_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
                  fi

    # Client images are published as two separate, single-arch image names.
    # Each one builds on a native runner for its architecture - no QEMU.
    #
    # Like the server, they are pushed **by digest and without a tag**. Tagging is
    # the publish job's business, and that one runs after the smoke test.
    build-client:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - id: client
                      arch: amd64
                      runner: ubuntu-latest
                      image_name: pbcm-client
                      dockerfile: ./docker/Dockerfile.client
                      platform: linux/amd64
                    - id: client-arm64
                      arch: arm64
                      runner: ubuntu-24.04-arm
                      image_name: pbcm-client-arm64
                      dockerfile: ./docker/Dockerfile.client.arm64
                      platform: linux/arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Tags are applied by the publish job; here we only need the labels.
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: ${{ matrix.platform }}
                  # Pass the calculated version as a build argument
                  build-args: |
                      APP_VERSION=${{ needs.prepare.outputs.version }}
                  # Pass GitHub token as secret for npm authentication
                  secrets: |
                      npm_token=${{ secrets.GITHUB_TOKEN }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.id }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.id }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }},push-by-digest=true,name-canonical=true,push=true

            # The file name is the digest; the file itself stays empty. It is the
            # cheapest way to hand a string from a matrix job to a later one --
            # matrix jobs cannot each set their own output.
            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-client-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # The server ships as a real multi-arch manifest. Each architecture is built
    # natively and pushed by digest only; merge-server assembles the manifest.
    build-server:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        env:
            SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                      platform: linux/amd64
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      platform: linux/arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Tags are applied by the merge job; here we only need the labels.
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.SERVER_IMAGE }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./docker/Dockerfile.server
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      APP_VERSION=${{ needs.prepare.outputs.version }}
                  secrets: |
                      npm_token=${{ secrets.GITHUB_TOKEN }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=server-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
                  outputs: type=image,name=${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-server-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # Starts what was just built and asks it whether it is alive. This is the only place
    # in the pipeline where the images are ever executed -- everything before it proves
    # that the code compiles, not that the result runs. An image whose entrypoint dies on
    # the first start used to pass every other job.
    #
    # It is a gate, not a report: nothing is tagged until it has passed, so `latest` can
    # no longer come to mean an image that never started.
    #
    # Both architectures, because the two client images are genuinely different builds:
    # amd64 installs proxmox-backup-client from the Proxmox repository, arm64 a community
    # .deb, and they sit on different Debian generations.
    smoke:
        name: Smoke test
        needs: [prepare, build-client, build-server]
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: read

        env:
            SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                      client_image: pbcm-client
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      client_image: pbcm-client-arm64

        steps:
            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # There is no tag to pull yet, so the images are addressed by digest --
            # which is more precise anyway: this is exactly the artefact this run
            # produced for this architecture, with nothing for docker to choose.
            - name: Download the digests for this architecture
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digests-*-${{ matrix.arch }}

            - name: Resolve the digests
              run: |
                  server=$(basename /tmp/digests/digests-server-${{ matrix.arch }}/*)
                  client=$(basename /tmp/digests/digests-client-${{ matrix.arch }}/*)
                  echo "SERVER_REF=$SERVER_IMAGE@sha256:$server" >> $GITHUB_ENV
                  echo "CLIENT_REF=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.client_image }}@sha256:$client" >> $GITHUB_ENV

            - name: Start the server image
              run: docker run -d --name pbcm-smoke-server -p 3000:3000 "$SERVER_REF"

            # The agent starts unregistered and idles -- exactly the state a fresh
            # installation is in before anyone has pointed it at a server.
            - name: Start the client image
              run: docker run -d --name pbcm-smoke-client -p 3001:3001 "$CLIENT_REF"

            - name: Wait for both to report healthy
              run: |
                  probe() {
                    local name=$1 url=$2
                    for i in $(seq 1 60); do
                      if curl -fsS "$url" | grep -q '"status":"ok"'; then
                        echo "$name answered after ${i}s"
                        return 0
                      fi
                      # A container that already exited will never answer -- say so now
                      # instead of waiting out the full minute.
                      if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                        echo "::error::$name is no longer running"
                        return 1
                      fi
                      sleep 1
                    done
                    echo "::error::$name did not become healthy within 60s"
                    return 1
                  }
                  probe pbcm-smoke-server http://127.0.0.1:3000/api/health
                  probe pbcm-smoke-client http://127.0.0.1:3001/api/health

            # Without this a failure above leaves only "exit 1" in the log, and the
            # reason is inside the container.
            - name: Container logs
              if: failure()
              run: |
                  echo "::group::server"; docker logs pbcm-smoke-server 2>&1 | tail -50; echo "::endgroup::"
                  echo "::group::client"; docker logs pbcm-smoke-client 2>&1 | tail -50; echo "::endgroup::"

            - name: Clean up
              if: always()
              run: docker rm -f pbcm-smoke-server pbcm-smoke-client 2>/dev/null || true

    # Nothing above carries a tag: every job so far pushed by digest only. This is
    # where a build becomes something a user can pull, and it runs **after** the
    # smoke test. That ordering is the whole point -- while tagging happened here
    # first, `latest` moved to an image nobody had ever started, and the smoke test
    # could only report the fact afterwards.
    #
    # A build that fails the smoke test leaves its digests in the registry untagged.
    # Nothing has to clean that up by hand: `delete-untagged` in the nightly Prune
    # Registry run sweeps them.
    publish:
        name: Tag and publish
        needs: [prepare, build-client, build-server, smoke]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        # From `needs`, not from `env.REGISTRY`: a job's `env` block cannot read the
        # `env` context at all. prepare composes the names for exactly that reason.
        env:
            SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}
            CLIENT_IMAGE: ${{ needs.prepare.outputs.client_image }}
            CLIENT_IMAGE_ARM64: ${{ needs.prepare.outputs.client_image_arm64 }}

        steps:
            # No merge-multiple: each artefact keeps its own directory, and the
            # directory name is what tells a server digest from a client one.
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digests-*

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # One metadata run for all three images -- `images` takes a list, and the
            # tag rules are identical for every one of them. The result is a flat list
            # of image:tag references that the step below splits up again by name.
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: |
                      ${{ env.SERVER_IMAGE }}
                      ${{ env.CLIENT_IMAGE }}
                      ${{ env.CLIENT_IMAGE_ARM64 }}
                  tags: |
                      # For a push to dev or a manual dispatch: the branch name
                      # (dev) plus the SHA
                      type=ref,event=branch
                      type=sha,prefix=sha-

                      # For a git tag (v1.0.0): version tags; {{major}}.{{minor}}
                      # is skipped automatically for a prerelease
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      # Only a stable release moves latest. A prerelease tag
                      # carries a hyphen (v1.4.0-beta.1) and must not, or a beta
                      # would land on every host that pulls latest.
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

            - name: Apply the tags
              run: |
                  # $1 is the image, the rest are its digests: two for the server,
                  # which becomes a real multi-arch manifest, one for each client.
                  publish() {
                      local image=$1 tags refs="" d
                      shift
                      # startswith the image *plus a colon*, or pbcm-client would
                      # also match every pbcm-client-arm64 reference.
                      tags=$(jq -cr --arg i "$image" \
                          '.tags | map(select(startswith($i + ":"))) | map("-t " + .) | join(" ")' \
                          <<< "$DOCKER_METADATA_OUTPUT_JSON")
                      if [ -z "$tags" ]; then
                          echo "::error::no tags were computed for $image"
                          return 1
                      fi
                      for d in "$@"; do refs="$refs $image@sha256:$d"; done
                      echo "$image <- $tags"
                      # Word splitting is what turns the strings into arguments here.
                      # shellcheck disable=SC2086
                      docker buildx imagetools create $tags $refs
                  }

                  publish "$SERVER_IMAGE"        $(basename -a /tmp/digests/digests-server-*/*)
                  publish "$CLIENT_IMAGE"        $(basename -a /tmp/digests/digests-client-amd64/*)
                  publish "$CLIENT_IMAGE_ARM64"  $(basename -a /tmp/digests/digests-client-arm64/*)

            - name: Inspect the published images
              run: |
                  for image in "$SERVER_IMAGE" "$CLIENT_IMAGE" "$CLIENT_IMAGE_ARM64"; do
                      echo "::group::$image"
                      docker buildx imagetools inspect "$image:${{ steps.meta.outputs.version }}"
                      echo "::endgroup::"
                  done
