name: Build and Version Client and Server

on:
    push:
        # Both long-lived branches publish a rolling image, so the current state
        # is always pullable without waiting for a release: :main is the state
        # released to everyone, :dev the one for developers. Neither creates a
        # version -- that happens only in release.yml, on request.
        #
        # The tag name needs no extra rule: type=ref,event=branch below already
        # yields the branch name, which is exactly `main` and `dev`.
        branches: ["main", "dev"]
        # A stable tag reaches this workflow only through the workflow_dispatch
        # that release.yml fires -- semantic-release pushes the tag over
        # GITHUB_TOKEN, and such a push creates no workflow run. The filter still
        # covers a tag pushed by hand, and would cover a prerelease (v1.4.0-beta.1)
        # the same way.
        tags: ["v*.*.*"]
        # A commit that only touches documentation changes nothing inside the
        # images, so it need not rebuild four of them. Path filters apply to
        # branch pushes only -- neither workflow_dispatch nor a tag is affected,
        # so the route a release takes to get here stays untouched.
        paths-ignore:
            - "docs/**"
            - "**.md"
    workflow_dispatch: # Allows manual trigger in the Actions tab, for any branch

# Pushing twice in a row to dev makes the older build pointless. Tag builds are
# never cancelled -- their image is the artefact of a release.
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
    REGISTRY: ghcr.io
    SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/pbcm-server

jobs:
    # Typecheck and lint before anything is published. Reuses ci.yml rather than
    # restating the steps, so the release gate cannot drift from the branch checks.
    verify:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            packages: read

    # Single source of truth for the version string, consumed by all build jobs.
    prepare:
        needs: verify
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            # The image reference the smoke job pulls. docker/metadata-action assigns
            # this tag through the `type=sha,prefix=sha-` rule on *every* trigger --
            # branch push, tag and dispatch alike -- so it is the one reference that
            # always exists and always means exactly this build. `dev` or `latest`
            # would be ambiguous the moment two runs overlap.
            sha_tag: ${{ steps.version.outputs.sha_tag }}
        steps:
            - name: Determine Version
              id: version
              run: |
                  echo "sha_tag=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    # Tag name without the leading v, so the string baked into the
                    # image matches the Docker tag (1.5.0), the root package.json
                    # and a locally built image. The tag itself stays v1.5.0.
                    echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
                  else
                    # Use branch-sha
                    SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
                    echo "version=${GITHUB_REF_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
                  fi

    # Client images are published as two separate, single-arch image names.
    # Each one builds on a native runner for its architecture - no QEMU.
    build-client:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - id: client
                      runner: ubuntu-latest
                      image_name: pbcm-client
                      dockerfile: ./docker/Dockerfile.client
                      platform: linux/amd64
                    - id: client-arm64
                      runner: ubuntu-24.04-arm
                      image_name: pbcm-client-arm64
                      dockerfile: ./docker/Dockerfile.client.arm64
                      platform: linux/arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
                  tags: |
                      # For a push to dev or a manual dispatch: the branch name
                      # (dev) plus the SHA
                      type=ref,event=branch
                      type=sha,prefix=sha-

                      # For a git tag (v1.0.0): version tags; {{major}}.{{minor}}
                      # is skipped automatically for a prerelease
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      # Only a stable release moves latest. A prerelease tag
                      # carries a hyphen (v1.4.0-beta.1) and must not, or a beta
                      # would land on every host that pulls latest.
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: ${{ matrix.platform }}
                  push: true
                  # Pass the calculated version as a build argument
                  build-args: |
                      APP_VERSION=${{ needs.prepare.outputs.version }}
                  # Pass GitHub token as secret for npm authentication
                  secrets: |
                      npm_token=${{ secrets.GITHUB_TOKEN }}
                  # Uses the automatically generated tags from above
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.id }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.id }}

    # The server ships as a real multi-arch manifest. Each architecture is built
    # natively and pushed by digest only; merge-server assembles the manifest.
    build-server:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                      platform: linux/amd64
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      platform: linux/arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Tags are applied by the merge job; here we only need the labels.
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.SERVER_IMAGE }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./docker/Dockerfile.server
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      APP_VERSION=${{ needs.prepare.outputs.version }}
                  secrets: |
                      npm_token=${{ secrets.GITHUB_TOKEN }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=server-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
                  outputs: type=image,name=${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v6
              with:
                  name: digests-server-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge-server:
        needs: [build-server]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digests-server-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.SERVER_IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      # Only a stable release moves latest. A prerelease tag
                      # carries a hyphen (v1.4.0-beta.1) and must not, or a beta
                      # would land on every host that pulls latest.
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.SERVER_IMAGE }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.version }}

    # Starts what was just published and asks it whether it is alive. This is the only
    # place in the pipeline where the images are ever executed -- everything before it
    # proves that the code compiles, not that the result runs. An image whose entrypoint
    # dies on the first start used to pass all seven jobs.
    #
    # Both architectures, because the two client images are genuinely different builds:
    # amd64 installs proxmox-backup-client from the Proxmox repository, arm64 a community
    # .deb, and they sit on different Debian generations.
    smoke:
        name: Smoke test
        needs: [prepare, merge-server, build-client]
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                      client_image: pbcm-client
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      client_image: pbcm-client-arm64

        steps:
            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # The server image is a manifest list, so docker picks the variant for this
            # runner's architecture by itself.
            - name: Start the server image
              run: |
                  docker run -d --name pbcm-smoke-server -p 3000:3000 \
                    ${{ env.SERVER_IMAGE }}:${{ needs.prepare.outputs.sha_tag }}

            # The agent starts unregistered and idles -- exactly the state a fresh
            # installation is in before anyone has pointed it at a server.
            - name: Start the client image
              run: |
                  docker run -d --name pbcm-smoke-client -p 3001:3001 \
                    ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.client_image }}:${{ needs.prepare.outputs.sha_tag }}

            - name: Wait for both to report healthy
              run: |
                  probe() {
                    local name=$1 url=$2
                    for i in $(seq 1 60); do
                      if curl -fsS "$url" | grep -q '"status":"ok"'; then
                        echo "$name answered after ${i}s"
                        return 0
                      fi
                      # A container that already exited will never answer -- say so now
                      # instead of waiting out the full minute.
                      if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                        echo "::error::$name is no longer running"
                        return 1
                      fi
                      sleep 1
                    done
                    echo "::error::$name did not become healthy within 60s"
                    return 1
                  }
                  probe pbcm-smoke-server http://127.0.0.1:3000/api/health
                  probe pbcm-smoke-client http://127.0.0.1:3001/api/health

            # Without this a failure above leaves only "exit 1" in the log, and the
            # reason is inside the container.
            - name: Container logs
              if: failure()
              run: |
                  echo "::group::server"; docker logs pbcm-smoke-server 2>&1 | tail -50; echo "::endgroup::"
                  echo "::group::client"; docker logs pbcm-smoke-client 2>&1 | tail -50; echo "::endgroup::"

            - name: Clean up
              if: always()
              run: docker rm -f pbcm-smoke-server pbcm-smoke-client 2>/dev/null || true
