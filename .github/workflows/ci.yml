name: Check Code

# Runs on every branch and pull request. build.yml calls this same job via
# workflow_call, so the release path is gated by exactly these checks -- no
# second copy that could drift.
on:
    # main and dev are covered by release.yml, which calls this workflow itself
    # -- listing them here too would run the checks twice for every push.
    push:
        branches-ignore: ["main", "dev"]
    pull_request:
    workflow_call:

# Three pushes in a row to a topic branch make the first two runs pointless.
# github.workflow is the *caller's* name when this workflow is reached through
# workflow_call, so a build.yml or release.yml run lands in its own group and
# cannot cancel -- or be cancelled by -- a plain branch run of these checks.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    # Same rule build.yml applies to itself: a tag is never cancelled. Without
    # that line a second build of the same tag -- a retried release -- would
    # cancel the checks of the first, which build.yml deliberately lets finish.
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
    verify:
        name: Typecheck, lint and test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # .npmrc resolves the @stefgo scope from GitHub Packages.
            packages: read

        env:
            # Without this, vite.config.ts aliases @stefgo/react-ui-components to a
            # sibling checkout (../../../react-ui-components) that only exists on a
            # developer machine. Same value the Dockerfile passes to its vite build.
            VITE_USE_LOCAL_UI: "false"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  # commitlint needs the commit range of the pull request.
                  fetch-depth: 0

            # cleanup-packages.yml names the images it prunes one by one. The
            # action can discover them by wildcard, but only with a classic PAT
            # carrying delete:packages -- a nightly, unattended delete right on
            # every container of the account, and the one credential in this
            # pipeline that would expire. The explicit list is the cheaper trade,
            # and this step is what keeps it from going stale unnoticed: a new
            # image in build.yml that nobody added to the cleanup would otherwise
            # simply never be pruned, and nothing would turn red.
            - name: Cleanup covers every published image
              run: |
                  published=$(grep -oE '(image_name|client_image): *pbcm-[a-z0-9-]+|/pbcm-[a-z0-9-]+' \
                      .github/workflows/build.yml | grep -oE 'pbcm-[a-z0-9-]+' | sort -u)
                  covered=$(sed -n 's/^ *packages: *//p' .github/workflows/cleanup-packages.yml \
                      | tr ',' '\n' | tr -d ' ' | grep -E '^pbcm-' | sort -u)
                  if [ -z "$published" ]; then
                      echo "::error::No image names found in build.yml -- the pattern above is out of date"
                      exit 1
                  fi
                  missing=$(comm -23 <(echo "$published") <(echo "$covered"))
                  if [ -n "$missing" ]; then
                      echo "::error::Published but not pruned by cleanup-packages.yml: $(echo $missing)"
                      exit 1
                  fi
                  echo "Covered: $(echo $covered)"

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  # .nvmrc matches the node:22 base image used by the Dockerfiles.
                  node-version-file: .nvmrc
                  cache: npm

            # Node 22 ships npm 10, the lockfile is written with npm 11. The two
            # do not agree on the optional peers of @commitlint/read, so npm ci
            # fails under the version that did not write the lockfile.
            # packageManager in package.json is the single source.
            - name: Pin npm
              run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

            - name: Install dependencies
              env:
                  NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npm ci

            # The commit message is the only input semantic-release derives the
            # next version from. A typo in the type produces no release at all,
            # without anything going red -- hence this check.
            - name: Commit messages
              if: github.event_name == 'pull_request'
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

            # Builds shared first, then every workspace -- this is the typecheck
            # for shared, backend and client, and the vite build for the frontend.
            - name: Build all workspaces
              run: npm run build

            # Reads shared from its source (the `development` export condition), so it
            # does not depend on the build above -- it runs after it only because a
            # build that fails is the cheaper thing to be told first.
            - name: Test
              run: npm test

            # The build above leaves shared's tests out (tsconfig.build.json), so they
            # do not end up in dist -- and Vitest strips types without checking them.
            # This is what checks them. The frontend's are covered by its typecheck
            # below, whose tsconfig includes all of src.
            - name: Typecheck shared tests
              run: npm run typecheck -w shared

            # The workspace script, not a second spelling of it: `typecheck` picks
            # tsconfig.json, while `typecheck:local-ui` picks the sibling-checkout
            # variant, and CI must stay on the first. Calling tsc directly here meant
            # the two could drift without anything noticing.
            - name: Typecheck frontend
              run: npm run typecheck -w server/frontend

            - name: Lint frontend
              run: npm run lint -w server/frontend

            # The root config, which covers shared, client and server/backend -- the
            # frontend is excluded there and linted by the step above with its own config.
            - name: Lint backend, client and shared
              run: npm run lint
