name: Docs

# Builds mkdocs.yml and publishes docs/ to GitHub Pages.
#
# Deliberately separate from ci.yml / release.yml. That chain is the release
# path -- ci.yml is called by build.yml via workflow_call so exactly one set of
# checks gates a release. A Python toolchain has no place in it, and a typo in
# a documentation page must not be able to block a release.
on:
    # main only. dev is the prerelease channel; a site flipping between the
    # stable and the beta state would be worse than one that lags a little.
    push:
        branches: ["main"]
        paths:
            - "docs/**"
            - "mkdocs.yml"
            - "requirements-docs.txt"
            - ".github/workflows/docs.yml"
    workflow_dispatch:

# One deployment at a time. Not cancelling: the last completed build is what
# stays live, and cutting one short would leave the previous version published
# with no indication why.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Build site
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-docs.txt

            # Pinned in requirements-docs.txt so this build and a local
            # `mkdocs serve` render the same output.
            - name: Install MkDocs Material
              run: pip install -r requirements-docs.txt

            # --strict turns a warning into a failure: an internal link that
            # points nowhere, a nav entry without a file, a page outside the
            # nav. This is the only automated link check the repository has --
            # nothing else notices when a moved document leaves a dead link
            # behind.
            - name: Build
              run: mkdocs build --strict

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write # deploy to the Pages environment ...
            id-token: write # ... which authenticates via OIDC
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v4
