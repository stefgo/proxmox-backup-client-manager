services:
  server-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.dev
      secrets:
        - npm_token
    image: pbcm-server-dev
    container_name: pbcm-server-dev
    hostname: pbcm-server-dev

    # Mount source code
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json

      # Preserve Linux node_modules
      - /app/node_modules
      - /app/server/backend/node_modules
      - /app/server/frontend/node_modules
      - /app/shared/node_modules
      # Note: server might need client's types depending on shared, so we keep the structure
      - /app/client/node_modules

      # Mount local UI components for development
      - ../react-ui-components:/app/react-ui-components

    working_dir: /app

    # Start server in watch mode
    command: npm run dev -w server/backend

    # Expose API port
    ports:
      - "3000:3000"

    environment:
      - LOG_LEVEL=debug
      - NODE_ENV=development
      - VITE_USE_LOCAL_UI=true
      - VITE_UI_COMPONENTS_PATH=/app/react-ui-components

    # Unlike the production images, Dockerfile.server.dev declares no HEALTHCHECK --
    # its CMD is `bash` and the real command comes from `command:` above. So this is
    # not a repetition here, it is the only health signal the dev container has.
    #
    # A longer start_period than in production: this waits for the TypeScript watch
    # build, not just for migrations.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3

  client-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.client.dev
      secrets:
        - npm_token
    image: pbcm-client-dev
    platform: linux/amd64
    container_name: pbcm-client-dev
    hostname: pbcm-client-dev

    depends_on:
      - server-dev

    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json

      # Preserve Linux node_modules
      - /app/node_modules
      - /app/client/node_modules
      - /app/shared/node_modules
      - /app/server/backend/node_modules

      # Mount local UI components for development
      - ../react-ui-components:/app/react-ui-components

      # Mount host filesystem
      - /:/mnt

    working_dir: /app

    # Command to start the client dev
    command: npm run dev -w client

    stdin_open: true
    tty: true

    # Expose API port
    ports:
      - "3001:3001"

    environment:
      - LOG_LEVEL=debug
      - NODE_ENV=development

    # See server-dev: Dockerfile.client.dev declares no HEALTHCHECK either.
    healthcheck:
      test: ["CMD", "node", "-e", "if (process.env.DISABLE_WEB_UI === 'true') process.exit(0); const p = process.env.PBCM_CLIENT_PORT || 3001; fetch('http://127.0.0.1:' + p + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3

secrets:
  npm_token:
    environment: NPM_TOKEN
